<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Watch Games</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }

  html, body {
    overflow: hidden;
  }

  body {
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Share Tech Mono', monospace;
  }

  /* WATCH SHELL */
  .watch {
    position: relative;
    width: 320px;
    height: 320px;
    transform-origin: center center;
  }

  .bezel {
    width: 320px;
    height: 320px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .screen {
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: #0d1a0f;
    overflow: hidden;
    position: relative;
  }

  /* green LCD glow */
  .screen::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 30%, rgba(100,255,120,0.04), transparent 70%);
    pointer-events: none;
    z-index: 100;
  }

  /* VIEWS */
  .view {
    display: none;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    overflow: hidden;
    position: absolute;
    top: 0; left: 0;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .view.active { display: flex; }

  /* MENU */
  #menu {
    background: #0d1a0f;
    gap: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    justify-content: flex-start;
    padding: 54px 0 40px;
  }

  #menu::-webkit-scrollbar {
    display: none;
  }

  .menu-title {
    font-family: 'Press Start 2P', monospace;
    color: #4dff6e;
    font-size: 13px;
    text-align: center;
    margin-bottom: 22px;
    text-shadow: 0 0 8px #4dff6e;
    letter-spacing: 1px;
    line-height: 1.4;
  }

  .menu-items {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }

  .menu-btn {
    background: none;
    border: 1px solid #2a5c30;
    color: #4dff6e;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    padding: 11px 20px;
    cursor: pointer;
    letter-spacing: 1px;
    text-shadow: 0 0 6px #4dff6e;
    transition: all 0.15s;
    width: 168px;
    text-align: center;
  }
  .menu-btn:active, .menu-btn:hover {
    background: #1a3d1e;
    border-color: #4dff6e;
    box-shadow: 0 0 10px rgba(77,255,110,0.3);
  }

  /* HUD COMMON */
  .hud {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: #4dff6e;
    text-shadow: 0 0 5px #4dff6e;
    position: absolute;
    z-index: 10;
  }

  .back-btn {
    position: absolute;
    bottom: 38px;
    left: 50%;
    transform: translateX(-50%);
    background: none;
    border: none;
    color: #1a3d1e;
    font-family: 'Press Start 2P', monospace;
    font-size: 5px;
    cursor: pointer;
    z-index: 20;
    padding: 2px 6px;
    letter-spacing: 0;
    opacity: 0.5;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .back-btn:active { color: #4dff6e; opacity: 1; }

  /* ===================== SNAKE ===================== */
  #snake-view {
    background: #0d1a0f;
    position: relative;
  }

  #snake-canvas {
    position: absolute;
    top: 0; left: 0;
  }

  #snake-score {
    top: 55px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 6px;
    pointer-events: none;
  }

  #snake-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 15;
    gap: 10px;
  }

  .overlay-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #4dff6e;
    text-shadow: 0 0 10px #4dff6e;
    text-align: center;
  }
  .overlay-sub {
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: #2a8c40;
    text-align: center;
    line-height: 1.6;
  }
  .overlay-btn {
    background: #1a3d1e;
    border: 1px solid #4dff6e;
    color: #4dff6e;
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    padding: 8px 14px;
    cursor: pointer;
    text-shadow: 0 0 6px #4dff6e;
    box-shadow: 0 0 10px rgba(77,255,110,0.2);
  }
  .overlay-btn:active { background: #2a5c30; }

  /* Snake edge buttons */
  #snake-dpad {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    pointer-events: none;
    z-index: 20;
  }
  .dpad-btn {
    position: absolute;
    background: rgba(77,255,110,0.07);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: rgba(77,255,110,0.45);
    font-size: 14px;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    pointer-events: all;
  }
  .dpad-btn:active { background: rgba(77,255,110,0.22); color: #4dff6e; }
  #dp-up    { top: 0; left: 50%; transform: translateX(-50%); width: 160px; height: 104px; border-radius: 0 0 80px 80px; }
  #dp-down  { bottom: 0; left: 50%; transform: translateX(-50%); width: 160px; height: 104px; border-radius: 80px 80px 0 0; }
  #dp-left  { left: 0; top: 50%; transform: translateY(-50%); width: 104px; height: 160px; border-radius: 0 80px 80px 0; }
  #dp-right { right: 0; top: 50%; transform: translateY(-50%); width: 104px; height: 160px; border-radius: 80px 0 0 80px; }

  /* ===================== REACTION ===================== */
  #reaction-view {
    background: #0d1a0f;
    flex-direction: column;
    gap: 10px;
    justify-content: center;
  }

  #reaction-ring {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid #2a5c30;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.1s, box-shadow 0.1s;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
  }
  #reaction-ring.green {
    border-color: #4dff6e;
    box-shadow: 0 0 30px rgba(77,255,110,0.5), inset 0 0 20px rgba(77,255,110,0.1);
    background: rgba(77,255,110,0.05);
  }
  #reaction-ring.red {
    border-color: #ff4d4d;
    box-shadow: 0 0 30px rgba(255,77,77,0.5), inset 0 0 20px rgba(255,77,77,0.1);
    background: rgba(255,77,77,0.05);
  }
  #reaction-inner {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: #4dff6e;
    text-align: center;
    line-height: 1.8;
    text-shadow: 0 0 6px currentColor;
    pointer-events: none;
  }
  #reaction-stats {
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: #2a8c40;
    text-align: center;
    line-height: 2;
  }
  #reaction-start {
    margin-top: 4px;
  }

  /* ===================== NUMBERS ===================== */
  #numbers-view {
    background: #0d1a0f;
    flex-direction: column;
    gap: 8px;
    padding: 30px 20px;
  }

  #numbers-prompt {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: #2a8c40;
    text-align: center;
  }
  #numbers-question {
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    color: #4dff6e;
    text-shadow: 0 0 10px #4dff6e;
    text-align: center;
    min-height: 30px;
  }
  #numbers-grid {
    display: grid;
    grid-template-columns: repeat(2, 64px);
    gap: 6px;
    justify-content: center;
  }
  .num-opt {
    background: rgba(77,255,110,0.06);
    border: 1px solid #2a5c30;
    color: #4dff6e;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    padding: 10px 0;
    text-align: center;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.1s;
    text-shadow: 0 0 6px #4dff6e;
  }
  .num-opt:active { background: rgba(77,255,110,0.2); }
  .num-opt.correct { border-color: #4dff6e; background: rgba(77,255,110,0.2); }
  .num-opt.wrong { border-color: #ff4d4d; color: #ff4d4d; text-shadow: 0 0 6px #ff4d4d; }
  #numbers-score-row {
    display: flex;
    gap: 16px;
    justify-content: center;
  }
  #numbers-score-row span {
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: #2a8c40;
  }
  #numbers-score-row .val {
    color: #4dff6e;
  }

  /* ===================== FRUIT CASCADE ===================== */
  #fruit-view {
    background: #0d1a0f;
    flex-direction: column;
    gap: 10px;
    padding: 16px 16px 48px;
  }
  #fruit-score-row {
    display: flex;
    gap: 16px;
    justify-content: center;
  }
  #fruit-score-row span {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #2a8c40;
  }
  #fruit-score-row .val {
    color: #4dff6e;
  }
  #fruit-canvas {
    border-radius: 6px;
    cursor: pointer;
  }

  /* ===================== BATTLE BOATS ===================== */
  #bb-view {
    background: #0d1a0f;
    flex-direction: column;
    gap: 10px;
    padding: 16px 16px 48px;
    position: relative;
  }
  #bb-score-row {
    display: flex;
    gap: 16px;
    justify-content: center;
  }
  #bb-score-row span {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #2a8c40;
  }
  #bb-score-row .val {
    color: #4dff6e;
  }
  #bb-canvas {
    border-radius: 6px;
    cursor: pointer;
  }
  #bb-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 15;
    gap: 10px;
  }

  /* ===================== BLOCKADE ===================== */
  #blockade-view {
    background: #0d1a0f;
    flex-direction: column;
    gap: 10px;
    padding: 16px 16px 48px;
    position: relative;
  }
  #bl-score-row {
    display: flex;
    gap: 14px;
    justify-content: center;
  }
  #bl-score-row span {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: #2a8c40;
  }
  #bl-score-row .val {
    color: #4dff6e;
  }
  #bl-canvas {
    border-radius: 4px;
  }
  #bl-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 15;
    gap: 10px;
  }

</style>
</head>
<body>

<div class="watch">
  <div class="bezel">
    <div class="screen">

      <!-- MENU -->
      <div class="view active" id="menu">
        <div class="menu-title">WATCH<br>GAMES</div>
        <div class="menu-items">
          <button class="menu-btn" onclick="startSnake()">🐍 SNAKE</button>
          <button class="menu-btn" onclick="startReaction()">⚡ REFLEX</button>
          <button class="menu-btn" onclick="startNumbers()">🔢 MATHS</button>
          <button class="menu-btn" onclick="startFruit()">🍓 FRUIT</button>
          <button class="menu-btn" onclick="startBattleBoats()">🚢 BOATS</button>
          <button class="menu-btn" onclick="startBlockade()">🧱 BLOCKADE</button>
        </div>
      </div>

      <!-- SNAKE -->
      <div class="view" id="snake-view">
        <canvas id="snake-canvas" width="320" height="320"></canvas>
        <div class="hud" id="snake-score">0</div>
        <div id="snake-overlay">
          <div class="overlay-title">SNAKE</div>
          <div class="overlay-sub">swipe or tap<br>arrows to move</div>
          <button class="overlay-btn" id="snake-start-btn" onclick="snakeStart()">START</button>
        </div>
        <div id="snake-dpad" style="display:none">
          <div class="dpad-btn" id="dp-up"    ontouchstart="snakeDir(0,-1)" onclick="snakeDir(0,-1)">▲</div>
          <div class="dpad-btn" id="dp-down"  ontouchstart="snakeDir(0,1)"  onclick="snakeDir(0,1)">▼</div>
          <div class="dpad-btn" id="dp-left"  ontouchstart="snakeDir(-1,0)" onclick="snakeDir(-1,0)">◀</div>
          <div class="dpad-btn" id="dp-right" ontouchstart="snakeDir(1,0)"  onclick="snakeDir(1,0)">▶</div>
        </div>
        <button class="back-btn" id="back-snake">hold: MENU</button>
      </div>

      <!-- REACTION / REFLEX -->
      <div class="view" id="reaction-view">
        <div id="reaction-ring" onclick="reactionTap()">
          <div id="reaction-inner">TAP<br>READY</div>
        </div>
        <div id="reaction-stats"></div>
        <button class="overlay-btn" id="reaction-start" onclick="reactionStart()">START</button>
        <button class="back-btn" id="back-reaction">hold: MENU</button>
      </div>

      <!-- MATHS -->
      <div class="view" id="numbers-view">
        <div id="numbers-prompt">SOLVE IT</div>
        <div id="numbers-question">?</div>
        <div id="numbers-grid">
          <button class="num-opt" id="nopt0" onclick="numAnswer(0)"></button>
          <button class="num-opt" id="nopt1" onclick="numAnswer(1)"></button>
          <button class="num-opt" id="nopt2" onclick="numAnswer(2)"></button>
          <button class="num-opt" id="nopt3" onclick="numAnswer(3)"></button>
        </div>
        <div id="numbers-score-row">
          <span>SCORE <span class="val" id="nscore">0</span></span>
          <span>BEST <span class="val" id="nbest">0</span></span>
        </div>
        <button class="back-btn" id="back-numbers">hold: MENU</button>
      </div>

      <!-- FRUIT CASCADE -->
      <div class="view" id="fruit-view">
        <div id="fruit-score-row">
          <span>SCORE <span class="val" id="fscore">0</span></span>
          <span>BEST <span class="val" id="fbest">0</span></span>
        </div>
        <canvas id="fruit-canvas" width="200" height="200"></canvas>
        <button class="back-btn" id="back-fruit">hold: MENU</button>
      </div>

      <!-- BATTLE BOATS -->
      <div class="view" id="bb-view">
        <div id="bb-score-row">
          <span>SHOTS <span class="val" id="bbshots">0</span></span>
          <span>SUNK <span class="val" id="bbsunk">0/3</span></span>
        </div>
        <canvas id="bb-canvas" width="210" height="210"></canvas>
        <div id="bb-overlay">
          <div class="overlay-title">BATTLE<br>BOATS</div>
          <div class="overlay-sub">tap grid to fire<br>sink all 3 ships</div>
          <button class="overlay-btn" onclick="bbStart()">START</button>
        </div>
        <button class="back-btn" id="back-bb">hold: MENU</button>
      </div>

      <!-- BLOCKADE -->
      <div class="view" id="blockade-view">
        <div id="bl-score-row">
          <span>SCORE <span class="val" id="blscore">0</span></span>
          <span>LINES <span class="val" id="bllines">0</span></span>
        </div>
        <canvas id="bl-canvas" width="108" height="216"></canvas>
        <div id="bl-overlay">
          <div class="overlay-title">BLOCKADE</div>
          <div class="overlay-sub">swipe: move / drop<br>tap: rotate</div>
          <button class="overlay-btn" onclick="blStart()">START</button>
        </div>
        <button class="back-btn" id="back-blockade">hold: MENU</button>
      </div>

    </div>
  </div>
</div>

<script>
// ── UTILS ──────────────────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goMenu() {
  snakeStop();
  reactionStop();
  fruitStop();
  bbStop();
  blockadeStop();
  show('menu');
}

// Scale the fixed 320x320 watch face to fill whatever screen it's on
// (phone browser, small watch browser, etc.) without touching any of the
// internal 320px-based layout/canvas math used throughout the games.
function fitWatch() {
  const scale = Math.min(window.innerWidth, window.innerHeight) / 320;
  document.querySelector('.watch').style.transform = `scale(${scale})`;
}
fitWatch();
window.addEventListener('resize', fitWatch);
window.addEventListener('orientationchange', fitWatch);

// ══════════════════════════════════════════════════
//  SNAKE
// ══════════════════════════════════════════════════
let snakeTick, snakeBody, snakeDirV, snakeNextDir, snakeFood, snakeScoreV, snakeAlive;
const SC = document.getElementById('snake-canvas');
const CTX = SC.getContext('2d');
const GRID = 20; // cells
const CELL = Math.floor(320 / GRID);
const RADIUS = 160;

function inCircle(cx, cy) {
  const px = (cx + 0.5) * CELL - RADIUS;
  const py = (cy + 0.5) * CELL - RADIUS;
  return px * px + py * py < (RADIUS - CELL * 0.5) * (RADIUS - CELL * 0.5);
}

function startSnake() {
  show('snake-view');
  snakeDraw();
  document.getElementById('snake-overlay').style.display = 'flex';
  document.getElementById('snake-dpad').style.display = 'none';
}

function snakeStart() {
  snakeBody = [{x:6,y:6},{x:5,y:6},{x:4,y:6}];
  snakeDirV = {x:1,y:0};
  snakeNextDir = {x:1,y:0};
  snakeScoreV = 0;
  snakeAlive = true;
  document.getElementById('snake-score').textContent = '0';
  document.getElementById('snake-overlay').style.display = 'none';
  document.getElementById('snake-dpad').style.display = 'block';
  placeFood();
  clearInterval(snakeTick);
  snakeTick = setInterval(snakeStep, 300);
}

function snakeStop() { clearInterval(snakeTick); }

function placeFood() {
  let cells = [];
  for(let x=0;x<GRID;x++) for(let y=0;y<GRID;y++) {
    if(inCircle(x,y) && !snakeBody.find(s=>s.x===x&&s.y===y)) cells.push({x,y});
  }
  if(cells.length) snakeFood = cells[Math.floor(Math.random()*cells.length)];
}

function snakeDir(dx,dy) {
  if(snakeDirV.x===0 && dx!==0) snakeNextDir={x:dx,y:0};
  else if(snakeDirV.y===0 && dy!==0) snakeNextDir={x:0,y:dy};
}

function snakeStep() {
  snakeDirV = snakeNextDir;
  const head = {x: snakeBody[0].x+snakeDirV.x, y: snakeBody[0].y+snakeDirV.y};
  if(!inCircle(head.x,head.y) || snakeBody.find(s=>s.x===head.x&&s.y===head.y)) {
    snakeAlive = false;
    clearInterval(snakeTick);
    document.getElementById('snake-overlay').innerHTML =
      `<div class="overlay-title">DEAD</div><div class="overlay-sub">score: ${snakeScoreV}</div><button class="overlay-btn" onclick="snakeStart()">RETRY</button>`;
    document.getElementById('snake-overlay').style.display = 'flex';
    document.getElementById('snake-dpad').style.display = 'none';
    return;
  }
  snakeBody.unshift(head);
  if(head.x===snakeFood.x && head.y===snakeFood.y) {
    snakeScoreV++;
    document.getElementById('snake-score').textContent = snakeScoreV;
    placeFood();
  } else {
    snakeBody.pop();
  }
  snakeDraw();
}

function snakeDraw() {
  CTX.clearRect(0,0,320,320);
  // grid dots
  CTX.fillStyle = 'rgba(77,255,110,0.04)';
  for(let x=0;x<GRID;x++) for(let y=0;y<GRID;y++) {
    if(inCircle(x,y)) CTX.fillRect(x*CELL+CELL/2-1,y*CELL+CELL/2-1,2,2);
  }
  // food
  if(snakeFood) {
    CTX.fillStyle = '#ff4d4d';
    CTX.shadowColor = '#ff4d4d';
    CTX.shadowBlur = 8;
    CTX.fillRect(snakeFood.x*CELL+2, snakeFood.y*CELL+2, CELL-4, CELL-4);
    CTX.shadowBlur = 0;
  }
  // snake
  if(!snakeBody) return;
  snakeBody.forEach((s,i) => {
    const alpha = i===0 ? 1 : 0.85 - i*(0.4/snakeBody.length);
    CTX.fillStyle = `rgba(77,255,110,${Math.max(0.3,alpha)})`;
    CTX.shadowColor = '#4dff6e';
    CTX.shadowBlur = i===0 ? 10 : 4;
    CTX.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);
  });
  CTX.shadowBlur = 0;
}

// swipe support for snake
let touchSX=0,touchSY=0;
document.getElementById('snake-view').addEventListener('touchstart',e=>{
  touchSX=e.touches[0].clientX; touchSY=e.touches[0].clientY;
},{passive:true});
document.getElementById('snake-view').addEventListener('touchend',e=>{
  if(!snakeAlive) return;
  const dx=e.changedTouches[0].clientX-touchSX;
  const dy=e.changedTouches[0].clientY-touchSY;
  if(Math.abs(dx)>Math.abs(dy)) { if(Math.abs(dx)>10) snakeDir(dx>0?1:-1,0); }
  else { if(Math.abs(dy)>10) snakeDir(0,dy>0?1:-1); }
},{passive:true});

// ══════════════════════════════════════════════════
//  REACTION / REFLEX
// ══════════════════════════════════════════════════
let reactionState='idle', reactionTimeout, reactionStart2, reactionTimes=[], reactionWaiting=false;

function startReaction() { show('reaction-view'); reactionReset(); }
function reactionStop() { clearTimeout(reactionTimeout); }

function reactionReset() {
  reactionState='idle';
  reactionWaiting=false;
  document.getElementById('reaction-ring').className='';
  document.getElementById('reaction-inner').textContent='TAP\nREADY';
  document.getElementById('reaction-inner').style.color='#4dff6e';
  document.getElementById('reaction-start').style.display='inline-block';
  document.getElementById('reaction-stats').textContent='';
  reactionTimes=[];
}

function reactionStart() {
  document.getElementById('reaction-start').style.display='none';
  reactionState='waiting';
  document.getElementById('reaction-ring').className='';
  document.getElementById('reaction-inner').textContent='WAIT...';
  reactionSchedule();
}

function reactionSchedule() {
  const delay = 1000 + Math.random()*3000;
  reactionTimeout = setTimeout(()=>{
    reactionState='go';
    document.getElementById('reaction-ring').className='green';
    document.getElementById('reaction-inner').textContent='TAP!';
    reactionStart2 = Date.now();
  }, delay);
}

function reactionTap() {
  if(reactionState==='go') {
    const ms = Date.now()-reactionStart2;
    reactionTimes.push(ms);
    document.getElementById('reaction-ring').className='';
    document.getElementById('reaction-inner').textContent=ms+'ms';
    const avg = Math.round(reactionTimes.reduce((a,b)=>a+b,0)/reactionTimes.length);
    document.getElementById('reaction-stats').innerHTML =
      `last: ${ms}ms<br>avg: ${avg}ms<br>rounds: ${reactionTimes.length}`;
    reactionState='waiting';
    if(reactionTimes.length>=5) {
      // show best
      const best = Math.min(...reactionTimes);
      document.getElementById('reaction-stats').innerHTML += `<br>best: ${best}ms`;
      document.getElementById('reaction-start').textContent='AGAIN';
      document.getElementById('reaction-start').style.display='inline-block';
      reactionState='idle';
      return;
    }
    setTimeout(()=>{ document.getElementById('reaction-inner').textContent='WAIT...'; reactionSchedule(); }, 800);
  } else if(reactionState==='waiting') {
    // too early
    clearTimeout(reactionTimeout);
    document.getElementById('reaction-ring').className='red';
    document.getElementById('reaction-inner').textContent='EARLY!';
    document.getElementById('reaction-inner').style.color='#ff4d4d';
    reactionState='waiting';
    setTimeout(()=>{
      document.getElementById('reaction-ring').className='';
      document.getElementById('reaction-inner').textContent='WAIT...';
      document.getElementById('reaction-inner').style.color='#4dff6e';
      reactionSchedule();
    }, 1000);
  }
}

// ══════════════════════════════════════════════════
//  MATHS QUIZ
// ══════════════════════════════════════════════════
let nScore=0, nBest=0, nCorrect=-1, nLocked=false;

function startNumbers() { show('numbers-view'); nScore=0; numNext(); }

function numNext() {
  nLocked=false;
  // generate question
  const ops=['+','-','×'];
  const op=ops[Math.floor(Math.random()*ops.length)];
  let a,b,ans;
  if(op==='+'){a=Math.floor(Math.random()*20)+1;b=Math.floor(Math.random()*20)+1;ans=a+b;}
  else if(op==='-'){a=Math.floor(Math.random()*20)+5;b=Math.floor(Math.random()*a)+1;ans=a-b;}
  else{a=Math.floor(Math.random()*10)+2;b=Math.floor(Math.random()*10)+2;ans=a*b;}
  document.getElementById('numbers-question').textContent=`${a}${op}${b}`;

  // build options
  let opts=[ans];
  while(opts.length<4){
    let wrong=ans+Math.floor(Math.random()*11)-5;
    if(wrong!==ans&&wrong>0&&!opts.includes(wrong)) opts.push(wrong);
  }
  opts.sort(()=>Math.random()-0.5);
  nCorrect=opts.indexOf(ans);
  for(let i=0;i<4;i++){
    const btn=document.getElementById('nopt'+i);
    btn.textContent=opts[i];
    btn.className='num-opt';
    btn.disabled=false;
  }
  document.getElementById('numbers-prompt').textContent='SOLVE IT';
}

function numAnswer(idx) {
  if(nLocked) return;
  nLocked=true;
  const btn=document.getElementById('nopt'+idx);
  if(idx===nCorrect){
    btn.classList.add('correct');
    nScore++;
    if(nScore>nBest) nBest=nScore;
    document.getElementById('numbers-prompt').textContent='CORRECT!';
  } else {
    btn.classList.add('wrong');
    document.getElementById('nopt'+nCorrect).classList.add('correct');
    nScore=0;
    document.getElementById('numbers-prompt').textContent='WRONG!';
  }
  document.getElementById('nscore').textContent=nScore;
  document.getElementById('nbest').textContent=nBest;
  setTimeout(numNext, 900);
}

// ══════════════════════════════════════════════════
//  FRUIT CASCADE
// ══════════════════════════════════════════════════
const FGRID = 5;
const FCELL = 40;
const FTYPES = ['🍋‍🟩','🍊','🍋','🍇','🍓'];
const FC = document.getElementById('fruit-canvas');
const FCTX = FC.getContext('2d');
let fBoard = [], fScore = 0, fBest = 0, fSelected = null, fBusy = false;

function startFruit() {
  show('fruit-view');
  fBest = parseInt(localStorage.getItem('watchGames_fruitBest') || '0', 10);
  fScore = 0;
  fSelected = null;
  fBusy = false;
  document.getElementById('fscore').textContent = fScore;
  document.getElementById('fbest').textContent = fBest;
  generateFruitBoard();
  fruitDraw();
}

function fruitStop() {
  fSelected = null;
}

function fruitActive() {
  return document.getElementById('fruit-view').classList.contains('active');
}

function generateFruitBoard() {
  do {
    fBoard = [];
    for (let y = 0; y < FGRID; y++) {
      const row = [];
      for (let x = 0; x < FGRID; x++) row.push(Math.floor(Math.random() * FTYPES.length));
      fBoard.push(row);
    }
  } while (findFruitMatches().length || !fruitHasMove());
}

function findFruitMatches() {
  const matched = new Set();
  for (let y = 0; y < FGRID; y++) {
    let run = 1;
    for (let x = 1; x <= FGRID; x++) {
      if (x < FGRID && fBoard[y][x] === fBoard[y][x - 1]) {
        run++;
      } else {
        if (run >= 3) for (let k = 0; k < run; k++) matched.add((x - 1 - k) + ',' + y);
        run = 1;
      }
    }
  }
  for (let x = 0; x < FGRID; x++) {
    let run = 1;
    for (let y = 1; y <= FGRID; y++) {
      if (y < FGRID && fBoard[y][x] === fBoard[y - 1][x]) {
        run++;
      } else {
        if (run >= 3) for (let k = 0; k < run; k++) matched.add(x + ',' + (y - 1 - k));
        run = 1;
      }
    }
  }
  return Array.from(matched).map(s => { const p = s.split(','); return { x: +p[0], y: +p[1] }; });
}

function fruitSwapCells(x1, y1, x2, y2) {
  const t = fBoard[y1][x1];
  fBoard[y1][x1] = fBoard[y2][x2];
  fBoard[y2][x2] = t;
}

function fruitHasMove() {
  for (let y = 0; y < FGRID; y++) {
    for (let x = 0; x < FGRID; x++) {
      if (x < FGRID - 1) {
        fruitSwapCells(x, y, x + 1, y);
        const m = findFruitMatches().length > 0;
        fruitSwapCells(x, y, x + 1, y);
        if (m) return true;
      }
      if (y < FGRID - 1) {
        fruitSwapCells(x, y, x, y + 1);
        const m = findFruitMatches().length > 0;
        fruitSwapCells(x, y, x, y + 1);
        if (m) return true;
      }
    }
  }
  return false;
}

function fruitDraw() {
  FCTX.clearRect(0, 0, FGRID * FCELL, FGRID * FCELL);
  for (let y = 0; y < FGRID; y++) {
    for (let x = 0; x < FGRID; x++) {
      if (fBoard[y][x] < 0) continue;
      const cx = x * FCELL + FCELL / 2;
      const cy = y * FCELL + FCELL / 2;
      if (fSelected && fSelected.x === x && fSelected.y === y) {
        FCTX.strokeStyle = '#4dff6e';
        FCTX.lineWidth = 2;
        FCTX.strokeRect(x * FCELL + 2, y * FCELL + 2, FCELL - 4, FCELL - 4);
      }
      FCTX.font = Math.floor(FCELL * 0.6) + 'px serif';
      FCTX.textAlign = 'center';
      FCTX.textBaseline = 'middle';
      FCTX.fillText(FTYPES[fBoard[y][x]], cx, cy);
    }
  }
}

function fruitTapXY(clientX, clientY) {
  if (!fruitActive()) return;
  const rect = FC.getBoundingClientRect();
  const x = Math.floor((clientX - rect.left) / (rect.width / FGRID));
  const y = Math.floor((clientY - rect.top) / (rect.height / FGRID));
  if (x < 0 || x >= FGRID || y < 0 || y >= FGRID) return;
  fruitTap(x, y);
}

function fruitTap(x, y) {
  if (fBusy) return;
  if (!fSelected) {
    fSelected = { x, y };
    fruitDraw();
    return;
  }
  if (fSelected.x === x && fSelected.y === y) {
    fSelected = null;
    fruitDraw();
    return;
  }
  const adjacent = (Math.abs(fSelected.x - x) + Math.abs(fSelected.y - y)) === 1;
  if (!adjacent) {
    fSelected = { x, y };
    fruitDraw();
    return;
  }
  const a = fSelected, b = { x, y };
  fSelected = null;
  fruitSwapCells(a.x, a.y, b.x, b.y);
  if (findFruitMatches().length === 0) {
    fruitSwapCells(a.x, a.y, b.x, b.y);
    fruitDraw();
    return;
  }
  fBusy = true;
  fruitDraw();
  setTimeout(fruitResolve, 120);
}

function fruitResolve() {
  if (!fruitActive()) { fBusy = false; return; }
  const matches = findFruitMatches();
  if (matches.length === 0) {
    fBusy = false;
    if (!fruitHasMove()) generateFruitBoard();
    fruitDraw();
    return;
  }
  fScore += matches.length * 10;
  document.getElementById('fscore').textContent = fScore;
  if (fScore > fBest) {
    fBest = fScore;
    document.getElementById('fbest').textContent = fBest;
    localStorage.setItem('watchGames_fruitBest', fBest);
  }
  matches.forEach(m => { fBoard[m.y][m.x] = -1; });
  fruitCollapse();
  fruitDraw();
  setTimeout(fruitResolve, 180);
}

function fruitCollapse() {
  for (let x = 0; x < FGRID; x++) {
    let write = FGRID - 1;
    for (let y = FGRID - 1; y >= 0; y--) {
      if (fBoard[y][x] !== -1) {
        fBoard[write][x] = fBoard[y][x];
        write--;
      }
    }
    for (let y = write; y >= 0; y--) {
      fBoard[y][x] = Math.floor(Math.random() * FTYPES.length);
    }
  }
}

FC.addEventListener('touchend', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  fruitTapXY(t.clientX, t.clientY);
}, { passive: false });
FC.addEventListener('click', e => {
  fruitTapXY(e.clientX, e.clientY);
});

// ══════════════════════════════════════════════════
//  BATTLE BOATS (simplified single-grid target-practice
//  version of battle-boats — no placement phase, no AI
//  opponent shooting back, just sink the hidden fleet)
// ══════════════════════════════════════════════════
const BGRID = 6;
const BCELL = 35;
const BSHIPS = [3, 2, 2];
const BC = document.getElementById('bb-canvas');
const BCTX = BC.getContext('2d');
let bbShipBoard = [], bbShotBoard = [], bbShipRemaining = [];
let bbShotsTaken = 0, bbSunkCount = 0, bbGameOver = true;

function startBattleBoats() {
  show('bb-view');
  document.getElementById('bb-overlay').innerHTML =
    '<div class="overlay-title">BATTLE<br>BOATS</div><div class="overlay-sub">tap grid to fire<br>sink all 3 ships</div><button class="overlay-btn" onclick="bbStart()">START</button>';
  document.getElementById('bb-overlay').style.display = 'flex';
  BCTX.clearRect(0, 0, BGRID * BCELL, BGRID * BCELL);
}

function bbStop() {
  bbGameOver = true;
}

function bbActive() {
  return document.getElementById('bb-view').classList.contains('active');
}

function bbGenerateBoard() {
  bbShipBoard = Array.from({ length: BGRID }, () => Array(BGRID).fill(-1));
  bbShotBoard = Array.from({ length: BGRID }, () => Array(BGRID).fill(0));
  bbShipRemaining = BSHIPS.slice();
  BSHIPS.forEach((len, idx) => bbPlaceShip(idx, len));
}

function bbPlaceShip(idx, len) {
  let attempts = 0;
  while (attempts < 300) {
    attempts++;
    const horizontal = Math.random() < 0.5;
    const x = Math.floor(Math.random() * (horizontal ? BGRID - len + 1 : BGRID));
    const y = Math.floor(Math.random() * (horizontal ? BGRID : BGRID - len + 1));
    let ok = true;
    for (let i = 0; i < len; i++) {
      const cx = horizontal ? x + i : x;
      const cy = horizontal ? y : y + i;
      if (bbShipBoard[cy][cx] !== -1) { ok = false; break; }
    }
    if (ok) {
      for (let i = 0; i < len; i++) {
        const cx = horizontal ? x + i : x;
        const cy = horizontal ? y : y + i;
        bbShipBoard[cy][cx] = idx;
      }
      return;
    }
  }
}

function bbStart() {
  bbGenerateBoard();
  bbShotsTaken = 0;
  bbSunkCount = 0;
  bbGameOver = false;
  document.getElementById('bbshots').textContent = 0;
  document.getElementById('bbsunk').textContent = '0/' + BSHIPS.length;
  document.getElementById('bb-overlay').style.display = 'none';
  bbDraw();
}

function bbDraw() {
  BCTX.clearRect(0, 0, BGRID * BCELL, BGRID * BCELL);
  for (let y = 0; y < BGRID; y++) {
    for (let x = 0; x < BGRID; x++) {
      const px = x * BCELL, py = y * BCELL;
      BCTX.strokeStyle = '#1a3d1e';
      BCTX.lineWidth = 1;
      BCTX.strokeRect(px + 0.5, py + 0.5, BCELL - 1, BCELL - 1);
      const shot = bbShotBoard[y][x];
      if (shot === 1) {
        const shipIdx = bbShipBoard[y][x];
        const sunk = bbShipRemaining[shipIdx] === 0;
        BCTX.fillStyle = sunk ? 'rgba(255,77,77,0.35)' : '#ff4d4d';
        BCTX.shadowColor = '#ff4d4d';
        BCTX.shadowBlur = sunk ? 0 : 8;
        BCTX.fillRect(px + 5, py + 5, BCELL - 10, BCELL - 10);
        BCTX.shadowBlur = 0;
      } else if (shot === 2) {
        BCTX.fillStyle = 'rgba(77,255,110,0.3)';
        BCTX.beginPath();
        BCTX.arc(px + BCELL / 2, py + BCELL / 2, BCELL * 0.14, 0, Math.PI * 2);
        BCTX.fill();
      }
    }
  }
}

function bbTapXY(clientX, clientY) {
  if (!bbActive() || bbGameOver) return;
  const rect = BC.getBoundingClientRect();
  const x = Math.floor((clientX - rect.left) / (rect.width / BGRID));
  const y = Math.floor((clientY - rect.top) / (rect.height / BGRID));
  if (x < 0 || x >= BGRID || y < 0 || y >= BGRID) return;
  bbFire(x, y);
}

function bbFire(x, y) {
  if (bbShotBoard[y][x] !== 0) return;
  const shipIdx = bbShipBoard[y][x];
  if (shipIdx === -1) {
    bbShotBoard[y][x] = 2;
  } else {
    bbShotBoard[y][x] = 1;
    bbShipRemaining[shipIdx]--;
    if (bbShipRemaining[shipIdx] === 0) {
      bbSunkCount++;
      document.getElementById('bbsunk').textContent = bbSunkCount + '/' + BSHIPS.length;
    }
  }
  bbShotsTaken++;
  document.getElementById('bbshots').textContent = bbShotsTaken;
  bbDraw();
  if (bbSunkCount === BSHIPS.length) {
    bbGameOver = true;
    document.getElementById('bb-overlay').innerHTML =
      `<div class="overlay-title">ALL SUNK!</div><div class="overlay-sub">shots: ${bbShotsTaken}</div><button class="overlay-btn" onclick="bbStart()">PLAY AGAIN</button>`;
    document.getElementById('bb-overlay').style.display = 'flex';
  }
}

BC.addEventListener('touchend', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  bbTapXY(t.clientX, t.clientY);
}, { passive: false });
BC.addEventListener('click', e => {
  bbTapXY(e.clientX, e.clientY);
});

// ══════════════════════════════════════════════════
//  BLOCKADE (simplified Tetris)
// ══════════════════════════════════════════════════
const BLCOLS = 6, BLROWS = 12, BLCELL = 18;
const BLPIECES = {
  I: { shape: [[1, 1, 1, 1]], color: '#4dd2ff' },
  O: { shape: [[1, 1], [1, 1]], color: '#ffe14d' },
  T: { shape: [[0, 1, 0], [1, 1, 1]], color: '#c04dff' },
  S: { shape: [[0, 1, 1], [1, 1, 0]], color: '#4dff6e' },
  Z: { shape: [[1, 1, 0], [0, 1, 1]], color: '#ff4d4d' },
  J: { shape: [[1, 0, 0], [1, 1, 1]], color: '#4d6bff' },
  L: { shape: [[0, 0, 1], [1, 1, 1]], color: '#ff9d4d' }
};
const BLKEYS = Object.keys(BLPIECES);
const BLC = document.getElementById('bl-canvas');
const BLCTX = BLC.getContext('2d');
let blBoard = [], blPiece = null, blScore = 0, blLines = 0, blLevel = 1;
let blBest = 0, blRunning = false, blTick = null, blDropMs = 650;
let blTouchSX = 0, blTouchSY = 0;

function startBlockade() {
  show('blockade-view');
  blBest = parseInt(localStorage.getItem('watchGames_blockadeBest') || '0', 10);
  document.getElementById('bl-overlay').innerHTML =
    `<div class="overlay-title">BLOCKADE</div><div class="overlay-sub">swipe: move / drop<br>tap: rotate</div><button class="overlay-btn" onclick="blStart()">START</button>`;
  document.getElementById('bl-overlay').style.display = 'flex';
  BLCTX.clearRect(0, 0, BLCOLS * BLCELL, BLROWS * BLCELL);
}

function blockadeStop() {
  blRunning = false;
  clearInterval(blTick);
}

function blActive() {
  return document.getElementById('blockade-view').classList.contains('active');
}

function blRotateMatrix(m) {
  const rows = m.length, cols = m[0].length;
  const res = Array.from({ length: cols }, () => Array(rows).fill(0));
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) res[c][rows - 1 - r] = m[r][c];
  }
  return res;
}

function blCollide(matrix, px, py) {
  for (let r = 0; r < matrix.length; r++) {
    for (let c = 0; c < matrix[r].length; c++) {
      if (!matrix[r][c]) continue;
      const bx = px + c, by = py + r;
      if (bx < 0 || bx >= BLCOLS || by >= BLROWS) return true;
      if (by >= 0 && blBoard[by][bx]) return true;
    }
  }
  return false;
}

function blSpawnPiece() {
  const key = BLKEYS[Math.floor(Math.random() * BLKEYS.length)];
  const def = BLPIECES[key];
  const matrix = def.shape.map(row => row.slice());
  const x = Math.floor((BLCOLS - matrix[0].length) / 2);
  blPiece = { matrix, x, y: 0, color: def.color };
  if (blCollide(matrix, x, 0)) {
    blEndGame();
  }
}

function blMerge() {
  const { matrix, x, y, color } = blPiece;
  for (let r = 0; r < matrix.length; r++) {
    for (let c = 0; c < matrix[r].length; c++) {
      if (matrix[r][c] && y + r >= 0) blBoard[y + r][x + c] = color;
    }
  }
}

function blClearLines() {
  let cleared = 0;
  for (let r = BLROWS - 1; r >= 0; r--) {
    if (blBoard[r].every(cell => cell !== 0)) {
      blBoard.splice(r, 1);
      blBoard.unshift(Array(BLCOLS).fill(0));
      cleared++;
      r++;
    }
  }
  return cleared;
}

function blLockPiece() {
  blMerge();
  const cleared = blClearLines();
  if (cleared > 0) {
    const scoreTable = { 1: 100, 2: 300, 3: 500, 4: 800 };
    blScore += (scoreTable[cleared] || 0) * blLevel;
    blLines += cleared;
    const newLevel = Math.floor(blLines / 10) + 1;
    if (newLevel !== blLevel) {
      blLevel = newLevel;
      blDropMs = Math.max(150, 650 - (blLevel - 1) * 60);
      if (blRunning) {
        clearInterval(blTick);
        blTick = setInterval(blStep, blDropMs);
      }
    }
    document.getElementById('blscore').textContent = blScore;
    document.getElementById('bllines').textContent = blLines;
    if (blScore > blBest) {
      blBest = blScore;
      localStorage.setItem('watchGames_blockadeBest', blBest);
    }
  }
  blSpawnPiece();
}

function blStep() {
  if (!blRunning) return;
  if (!blCollide(blPiece.matrix, blPiece.x, blPiece.y + 1)) {
    blPiece.y++;
  } else {
    blLockPiece();
  }
  blDraw();
}

function blMove(dx) {
  if (!blRunning || !blPiece) return;
  if (!blCollide(blPiece.matrix, blPiece.x + dx, blPiece.y)) {
    blPiece.x += dx;
    blDraw();
  }
}

function blRotate() {
  if (!blRunning || !blPiece) return;
  const rotated = blRotateMatrix(blPiece.matrix);
  if (!blCollide(rotated, blPiece.x, blPiece.y)) {
    blPiece.matrix = rotated;
  } else if (!blCollide(rotated, blPiece.x - 1, blPiece.y)) {
    blPiece.matrix = rotated;
    blPiece.x -= 1;
  } else if (!blCollide(rotated, blPiece.x + 1, blPiece.y)) {
    blPiece.matrix = rotated;
    blPiece.x += 1;
  }
  blDraw();
}

function blHardDrop() {
  if (!blRunning || !blPiece) return;
  while (!blCollide(blPiece.matrix, blPiece.x, blPiece.y + 1)) blPiece.y++;
  blLockPiece();
  blDraw();
}

function blEndGame() {
  blRunning = false;
  clearInterval(blTick);
  document.getElementById('bl-overlay').innerHTML =
    `<div class="overlay-title">GAME<br>OVER</div><div class="overlay-sub">score: ${blScore}<br>best: ${blBest}</div><button class="overlay-btn" onclick="blStart()">RETRY</button>`;
  document.getElementById('bl-overlay').style.display = 'flex';
}

function blStart() {
  blBoard = Array.from({ length: BLROWS }, () => Array(BLCOLS).fill(0));
  blScore = 0;
  blLines = 0;
  blLevel = 1;
  blDropMs = 650;
  blRunning = true;
  document.getElementById('blscore').textContent = 0;
  document.getElementById('bllines').textContent = 0;
  document.getElementById('bl-overlay').style.display = 'none';
  blSpawnPiece();
  blDraw();
  clearInterval(blTick);
  blTick = setInterval(blStep, blDropMs);
}

function blDraw() {
  BLCTX.clearRect(0, 0, BLCOLS * BLCELL, BLROWS * BLCELL);
  BLCTX.strokeStyle = '#1a3d1e';
  BLCTX.lineWidth = 1;
  for (let r = 0; r < BLROWS; r++) {
    for (let c = 0; c < BLCOLS; c++) {
      BLCTX.strokeRect(c * BLCELL + 0.5, r * BLCELL + 0.5, BLCELL - 1, BLCELL - 1);
      if (blBoard[r][c]) {
        BLCTX.fillStyle = blBoard[r][c];
        BLCTX.fillRect(c * BLCELL + 1, r * BLCELL + 1, BLCELL - 2, BLCELL - 2);
      }
    }
  }
  if (blPiece) {
    const { matrix, x, y, color } = blPiece;
    BLCTX.fillStyle = color;
    BLCTX.shadowColor = color;
    BLCTX.shadowBlur = 6;
    for (let r = 0; r < matrix.length; r++) {
      for (let c = 0; c < matrix[r].length; c++) {
        if (matrix[r][c] && y + r >= 0) {
          BLCTX.fillRect((x + c) * BLCELL + 1, (y + r) * BLCELL + 1, BLCELL - 2, BLCELL - 2);
        }
      }
    }
    BLCTX.shadowBlur = 0;
  }
}

function blHandleGesture(dx, dy) {
  if (!blActive() || !blRunning) return;
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12) {
    blRotate();
  } else if (Math.abs(dx) > Math.abs(dy)) {
    blMove(dx > 0 ? 1 : -1);
  } else if (dy > 12) {
    blHardDrop();
  }
}

document.getElementById('blockade-view').addEventListener('touchstart', e => {
  blTouchSX = e.touches[0].clientX;
  blTouchSY = e.touches[0].clientY;
}, { passive: true });
document.getElementById('blockade-view').addEventListener('touchend', e => {
  e.preventDefault();
  const dx = e.changedTouches[0].clientX - blTouchSX;
  const dy = e.changedTouches[0].clientY - blTouchSY;
  blHandleGesture(dx, dy);
}, { passive: false });
document.getElementById('blockade-view').addEventListener('mousedown', e => {
  blTouchSX = e.clientX;
  blTouchSY = e.clientY;
});
document.getElementById('blockade-view').addEventListener('mouseup', e => {
  const dx = e.clientX - blTouchSX;
  const dy = e.clientY - blTouchSY;
  blHandleGesture(dx, dy);
});

// ── INIT ──────────────────────────────────────────
snakeDraw();

// Long-press back buttons (600ms hold to go to menu)
['back-snake','back-reaction','back-numbers','back-fruit','back-bb','back-blockade'].forEach(id => {
  const btn = document.getElementById(id);
  let raf;
  const DURATION = 600;

  function startHold(e) {
    e.preventDefault();
    const start = Date.now();
    function tick() {
      const progress = Math.min(1, (Date.now() - start) / DURATION);
      btn.style.opacity = 0.5 + progress * 0.5;
      if (progress >= 1) { goMenu(); btn.style.opacity = ''; }
      else { raf = requestAnimationFrame(tick); }
    }
    raf = requestAnimationFrame(tick);
  }

  function endHold() {
    cancelAnimationFrame(raf);
    btn.style.opacity = '';
  }

  btn.addEventListener('mousedown', startHold);
  btn.addEventListener('touchstart', startHold, {passive: false});
  btn.addEventListener('mouseup', endHold);
  btn.addEventListener('mouseleave', endHold);
  btn.addEventListener('touchend', endHold);
  btn.addEventListener('touchcancel', endHold);
  btn.addEventListener('click', e => e.preventDefault());
});
</script>
